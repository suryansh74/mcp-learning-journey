services:
  mcp:
    build: ./server
    ports:
      - "8000:8000"
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"

  # Optional public door for the MCP server. Not required for the web UI.
  # Logs print https://....trycloudflare.com — append /mcp if an outside client needs it.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://mcp:8000
    depends_on:
      - mcp

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      # Same Docker network, so the site calls the server by service name.
      # No pasted URL, and no npm run dev.
      MCP_SERVER_URL: http://mcp:8000/mcp
    depends_on:
      - mcp
